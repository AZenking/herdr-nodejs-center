id = "server-center"
name = "Server Center"
version = "0.1.0"
min_herdr_version = "0.7.5"
description = "Monitor local Node.js, Bun, and Deno services in a live Herdr panel"
platforms = ["macos"]

[[actions]]
id = "open"
title = "Open Server Center"
contexts = ["global"]
command = ["node", "src/open.js"]

[[panes]]
id = "dashboard"
title = "Server Center"
placement = "popup"
width = "90%"
height = "80%"
command = ["node", "src/server-center.js"]
